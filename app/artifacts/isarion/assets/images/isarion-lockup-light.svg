<svg viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Isarion logo, light background</title>
<desc>Horizontal logo lockup: the Isarion guide-star mark beside the wordmark Isarion, dark text on a white plate.</desc>
<!-- For production/print, convert the text to outlines (e.g. "Create Outlines" in Illustrator) so it renders correctly without the Space Grotesk font installed. -->
<defs>
<linearGradient id="starGradL" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#6366F1"/>
<stop offset="1" stop-color="#F0653D"/>
</linearGradient>
</defs>
<rect width="420" height="120" rx="14" fill="#ffffff"/>
<g transform="translate(14,10) scale(0.92)">
<path d="M32,66 C38,60 42,58 48,52 C54,46 58,42 61,38" fill="none" stroke="#b7bbd0" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
<circle cx="32" cy="66" r="4.4" fill="#9aa0b8"/>
<circle cx="48" cy="52" r="5.6" fill="#4b5170"/>
<polygon points="66,25 68.12,31.88 75,34 68.12,36.12 66,43 63.88,36.12 57,34 63.88,31.88" fill="url(#starGradL)"/>
</g>
<text x="120" y="72" font-family="Space Grotesk, Inter, sans-serif" font-weight="700" font-size="40" letter-spacing="-1" fill="#12141c">Isarion</text>
</svg>
